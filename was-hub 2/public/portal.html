<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Portal do Cliente — WAS</title>
<link rel="stylesheet" href="/app.css" />
</head>
<body>
  <div id="content">
    <div class="portal-body"><p style="color:var(--text-dim)">Carregando...</p></div>
  </div>

<script>
const STATUS_LABELS = {
  backlog: 'Backlog',
  em_producao: 'Em produção',
  revisao_interna: 'Revisão interna',
  aprovacao_cliente: 'Aguardando sua aprovação',
  aprovado: 'Aprovado',
  publicado: 'Publicado',
};

function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

async function init() {
  const params = new URLSearchParams(location.search);
  const slug = params.get('slug');
  const content = document.getElementById('content');

  if (!slug) {
    content.innerHTML = '<div class="portal-body"><p>Link inválido. Peça o link correto para a equipe WAS.</p></div>';
    return;
  }

  let data;
  try {
    const res = await fetch('/api/portal/' + encodeURIComponent(slug));
    if (!res.ok) throw new Error();
    data = await res.json();
  } catch (e) {
    content.innerHTML = '<div class="portal-body"><p>Cliente não encontrado. Verifique o link.</p></div>';
    return;
  }

  const { client, demands, strategies } = data;

  const grouped = {};
  Object.keys(STATUS_LABELS).forEach((k) => (grouped[k] = []));
  demands.forEach((d) => grouped[d.status]?.push(d));

  content.innerHTML = `
    <div class="portal-header">
      <h1>${escapeHtml(client.name)}</h1>
      <p>Acompanhamento de entregas — We Are Sinergy</p>
    </div>
    <div class="portal-body">
      <div class="portal-section">
        <h2>Status das entregas</h2>
        ${demands.length ? Object.entries(STATUS_LABELS).map(([key, label]) => {
          const items = grouped[key];
          if (!items.length) return '';
          return `
            <div style="margin-bottom:20px">
              <div style="font-size:12px;font-weight:700;color:var(--text-dim);margin-bottom:8px">${label} (${items.length})</div>
              <div class="card-list">
                ${items.map((d) => `
                  <div class="client-card">
                    <div>
                      <div class="name">${escapeHtml(d.title)}</div>
                      <div class="meta">${d.description ? escapeHtml(d.description) + ' · ' : ''}${d.due_date ? 'prazo: ' + d.due_date : ''}</div>
                    </div>
                    ${d.link ? `<a href="${escapeHtml(d.link)}" target="_blank" class="btn small secondary">Abrir</a>` : ''}
                  </div>
                `).join('')}
              </div>
            </div>
          `;
        }).join('') : '<div class="empty-state">Nenhuma entrega compartilhada ainda.</div>'}
      </div>

      ${strategies.length ? `
        <div class="portal-section">
          <h2>Estratégia</h2>
          ${strategies.map((s) => `
            <div class="strategy-doc">
              <h3>${escapeHtml(s.title)}</h3>
              <div class="meta">${s.period ? escapeHtml(s.period) : ''}</div>
              <div class="content">${escapeHtml(s.content)}</div>
            </div>
          `).join('')}
        </div>
      ` : ''}
    </div>
  `;
}

init();
</script>
</body>
</html>
